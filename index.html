<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Lost & Found UNJ</title>
  <link rel="icon" type="image/x-icon" href="/assets/unjlogoico.ico">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Brand -->
  <link rel="stylesheet" href="assets/brand.css">
</head>
<body>
  <!-- Loader Overlay -->
  <div id="loader" class="lf-loader" aria-live="polite" aria-busy="true" hidden>
    <div class="lf-loader-inner">
      <div class="spinner-border text-light" role="status" aria-label="Loading"></div>
      <div class="mt-2 small text-white-50">Loading data…</div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

  <div class="container py-4">
    <header class="d-flex justify-content-center align-items-center mb-3">
      <img id="brand-logo" src="assets/logo.png" alt="Lost & Found UNJ logo">
    </header>

    <!-- Tabs + Report button -->
    <div class="d-flex flex-column flex-md-row align-items-md-center gap-2 mb-3">
      <ul class="nav nav-pills gap-2" id="lfTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="lost-tab" data-bs-toggle="pill" data-bs-target="#lost-pane" type="button" role="tab">Lost</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="found-tab" data-bs-toggle="pill" data-bs-target="#found-pane" type="button" role="tab">Found</button>
        </li>
      </ul>
      <a href="https://forms.gle/ChUpk3x3BMwSLQXN7" target="_blank" rel="noopener" class="btn btn-danger ms-md-auto">Report</a>
    </div>

    <div class="tab-content">
      <!-- LOST -->
      <div class="tab-pane fade show active" id="lost-pane" role="tabpanel">
        <div class="search-wrap mb-3">
          <input id="search-lost" type="search" class="form-control" placeholder="Search lost items…">
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-5 g-3" id="grid-lost"></div>
      </div>

      <!-- FOUND -->
      <div class="tab-pane fade" id="found-pane" role="tabpanel">
        <div class="search-wrap mb-3">
          <input id="search-found" type="search" class="form-control" placeholder="Search found items…">
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-5 g-3" id="grid-found"></div>
      </div>
    </div>

    <hr>
    <div id="debug" class="small text-muted"></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Item details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <img id="d-image" class="w-100 rounded mb-3" alt="Image" style="max-height:320px;object-fit:cover;">
          <dl class="row">
            <dt class="col-sm-4 fw-bold">Name</dt><dd class="col-sm-8" id="d-name"></dd>
            <dt class="col-sm-4 fw-bold">WhatsApp</dt><dd class="col-sm-8" id="d-phone"></dd>
            <dt class="col-sm-4 fw-bold">Category</dt><dd class="col-sm-8" id="d-category"></dd>
            <dt class="col-sm-4 fw-bold">Item</dt><dd class="col-sm-8" id="d-item"></dd>
            <dt class="col-sm-4 fw-bold">Description</dt><dd class="col-sm-8" id="d-desc"></dd>
            <dt class="col-sm-4 fw-bold">Where</dt><dd class="col-sm-8" id="d-where"></dd>
            <dt class="col-sm-4 fw-bold">When</dt><dd class="col-sm-8" id="d-when"></dd>
          </dl>
        </div>
        <div class="modal-footer">
          <a id="d-wa" target="_blank" class="btn btn-brand">Contact on WhatsApp</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/script.js"></script>
</body>
</html>
